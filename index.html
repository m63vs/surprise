<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Для Кати</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one quiet screen per question. A point of light hangs above the column, a small constellation grows across the top as answers are given, navigation is pinned to the bottom. One night-time look on purpose: the accent colour (default warm candle) shifts with the chosen style. */
@property --gr { syntax: '<number>'; inherits: true; initial-value: 233; }
@property --gg { syntax: '<number>'; inherits: true; initial-value: 185; }
@property --gb { syntax: '<number>'; inherits: true; initial-value: 139; }
:root {
  --gr: 233; --gg: 185; --gb: 139;
  --rgb: var(--gr), var(--gg), var(--gb);
  --ink: #14101b;
  --ink-2: #1d1726;
  --ink-3: #2a2236;
  --line: #3a3047;
  --text: #f2e9df;
  --muted: #a699b2;
  --glow: rgb(var(--rgb));
  --glow-ink: #1a1320;
  --font-display: 'Cormorant Garamond', 'Iowan Old Style', 'Times New Roman', serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
  transition: --gr 1.4s ease, --gg 1.4s ease, --gb 1.4s ease;
}
html { height: 100%; background: var(--ink); overflow-x: hidden; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--ink);
  color: var(--text);
  font: 400 16px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.glow {
  position: fixed; left: calc(50% + var(--p, 0) * 2%); top: calc(-18vh + var(--p, 0) * 1.5vh);
  transition: left 1.4s ease, top 1.4s ease;
  width: 130vw; max-width: 900px; aspect-ratio: 1;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(var(--rgb), .22), rgba(var(--rgb), .07) 55%, transparent);
  pointer-events: none; z-index: 0;
  animation: breathe 10s ease-in-out infinite alternate;
}
@keyframes breathe {
  from { opacity: .65; transform: translateX(-50%) scale(.96); }
  to { opacity: 1; transform: translateX(-50%) scale(1.04); }
}
.app {
  position: relative; z-index: 1;
  max-width: 460px; margin: 0 auto;
  min-height: 80vh;
  min-height: calc(100dvh - 70px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  padding-top: 22px;
  display: flex; flex-direction: column;
}

/* Constellation: one star per answered step */
.cons { display: block; width: 100%; height: auto; max-height: 56px; margin-bottom: 26px; overflow: visible; }
.cons.big { max-height: 64px; margin-bottom: 18px; }
.cons line { stroke: var(--line); stroke-width: .7; }
.cons line.on { stroke: rgba(var(--rgb), .75); }
.cons line.cur { stroke-dasharray: 60; animation: linein .9s .1s ease backwards; }
.cons circle { fill: #4a3d5a; }
.cons .halo { fill: var(--glow); fill-opacity: .16; }
.cons circle.on { fill: var(--glow); animation: starpulse 3.4s ease-in-out infinite alternate; }
.cons circle.cur { animation: starin .9s .3s ease backwards, starpulse 3.4s 1.2s ease-in-out infinite alternate; }
@keyframes linein { from { stroke-dashoffset: 60; } }
@keyframes starin { from { opacity: 0; } }
@keyframes starpulse { from { opacity: .7; } to { opacity: 1; } }

.step { flex: 1; display: flex; flex-direction: column; animation: stepin .4s ease backwards; }
.step.leave { animation: leave .26s ease forwards; }
@keyframes stepin { from { opacity: 0; } }
@keyframes leave { to { opacity: 0; transform: translateY(-8px); } }

.title {
  font-family: var(--font-display); font-weight: 500;
  font-size: clamp(34px, 10vw, 44px); line-height: 1.08;
  margin: 0 0 10px; text-wrap: balance;
}
.lead { color: var(--muted); margin: 0 0 26px; max-width: 38ch; text-wrap: pretty; }
.group + .group { margin-top: 28px; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.hint { font-size: 13px; color: var(--muted); margin: 12px 0 0; max-width: 40ch; }

.cards { display: grid; gap: 10px; }
.opt {
  font: inherit; color: inherit; text-align: left;
  background: var(--ink-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; cursor: pointer; position: relative;
  transition: border-color .2s, background .2s;
}
.opt[aria-pressed="true"] { border-color: var(--glow); background: var(--ink-3); }
.opt:focus-visible, .swatch:focus-visible .dot { outline: 2px solid var(--glow); outline-offset: 3px; }
.card .name { font-family: var(--font-display); font-size: 27px; font-weight: 600; line-height: 1.1; display: block; }
.card .sub { display: block; color: var(--muted); font-size: 14px; margin-top: 5px; padding-right: 30px; text-wrap: pretty; }
.card .sw { display: flex; gap: 6px; margin-top: 13px; }
.card .sw b { width: 28px; height: 10px; border-radius: 5px; display: block; }
.card::after {
  content: ""; position: absolute; top: 18px; right: 16px;
  width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line);
}
.card[aria-pressed="true"]::after { background: var(--glow); border-color: var(--glow); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 999px; padding: 10px 16px; font-size: 15px; }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 14px 8px; }
.swatch {
  background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer;
}
.swatch .dot { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); box-shadow: 0 0 0 3px var(--ink); transition: box-shadow .2s; }
.swatch[aria-pressed="true"] { color: var(--text); }
.swatch[aria-pressed="true"] .dot { box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--glow); }

.field { display: grid; gap: 6px; }
.field + .field { margin-top: 16px; }
.field label { font-size: 13px; color: var(--muted); }
input[type="text"], textarea {
  font: inherit; font-size: 16px; color: var(--text);
  background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; width: 100%; box-sizing: border-box; resize: vertical;
}
input[type="text"]::placeholder, textarea::placeholder { color: #6f6580; }
input[type="text"]:focus-visible, textarea:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 34px; }
.btn {
  font: 600 16px/1 var(--font-body); border: 0; border-radius: 999px;
  padding: 15px 26px; cursor: pointer; background: var(--glow); color: var(--glow-ink);
  text-decoration: none; display: inline-block; text-align: center;
}
.btn[disabled] { opacity: .35; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.link { background: none; border: 0; color: var(--muted); font: inherit; padding: 12px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
.link:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.need { font-size: 13px; color: var(--muted); min-height: 1.4em; margin: 16px 0 0; }

.whisper { font-family: var(--font-display); font-style: italic; font-size: 24px; line-height: 1.2; color: var(--glow); margin: 18px 0 0; min-height: 1.3em; opacity: 0; }
.whisper.show { animation: whisper 3.2s ease forwards; }
@keyframes whisper {
  0% { opacity: 0; transform: translateY(6px); filter: blur(4px); }
  15% { opacity: 1; transform: none; filter: none; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

.intro { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 6vh; }
.eyebrow { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--glow); display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.eyebrow::after { content: ""; height: 1px; width: 0; background: var(--glow); animation: draw 1.6s .4s ease forwards; }
@keyframes draw { to { width: 56px; } }
.intro .title { font-size: clamp(60px, 20vw, 88px); font-style: italic; line-height: .98; margin-bottom: 26px; }
.intro .line { font-family: var(--font-display); font-size: clamp(24px, 7vw, 30px); line-height: 1.25; margin: 0 0 8px; }
.intro .line.l2 { color: var(--glow); font-style: italic; }
.line .off { visibility: hidden; }
.caret { display: none; width: 2px; height: 1em; margin-left: 2px; background: var(--glow); vertical-align: -.12em; }
.line.active .caret { display: inline-block; animation: blink .9s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.seal-btn {
  position: relative; align-self: flex-start; margin-top: 36px; width: 76px; height: 76px;
  border: 0; padding: 0; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), rgba(255,255,255,0) 45%), var(--glow);
  box-shadow: 0 0 30px rgba(var(--rgb), .5), inset 0 -5px 10px rgba(0,0,0,.28);
  opacity: 0;
}
.seal-btn::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; border: 1px solid rgba(26,19,32,.35); }
.seal-btn::after {
  content: ""; position: absolute; inset: 24px; background: rgba(26,19,32,.5);
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
}
.seal-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 5px; }
.seal-cap { margin: 16px 0 0; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); opacity: 0; }
.intro.ready .seal-btn { animation: fadein 1.2s ease forwards, sealpulse 3.2s 1.4s ease-in-out infinite; }
.intro.ready .seal-cap { animation: fadein 1.2s .4s ease forwards; }
.seal-btn.crack { opacity: 1; animation: crack .65s ease forwards !important; }
@keyframes fadein { to { opacity: 1; } }
@keyframes sealpulse { 0%, 100% { box-shadow: 0 0 22px rgba(var(--rgb), .4), inset 0 -5px 10px rgba(0,0,0,.28); } 50% { box-shadow: 0 0 46px 6px rgba(var(--rgb), .7), inset 0 -5px 10px rgba(0,0,0,.28); } }
@keyframes crack {
  0% { transform: scale(1); opacity: 1; }
  35% { transform: scale(1.18) rotate(8deg); opacity: 1; }
  100% { transform: scale(3); opacity: 0; }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px) rotate(-5deg); }
  40% { transform: translateX(7px) rotate(5deg); }
  60% { transform: translateX(-4px) rotate(-3deg); }
  80% { transform: translateX(4px) rotate(3deg); }
}

/* Riddle at the seal */
.riddle .title { font-size: clamp(44px, 14vw, 60px); margin-bottom: 18px; }
.rline { font-family: var(--font-display); font-size: clamp(20px, 5.8vw, 24px); line-height: 1.3; margin: 0 0 10px; animation: soft 1s var(--d, 0s) ease backwards; }
.rline.em { color: var(--glow); font-style: italic; }
.rform { display: flex; gap: 10px; margin-top: 16px; animation: soft .8s 4.6s ease backwards; }
.rform input { flex: 1; min-width: 0; }
.rform .btn { flex: none; padding-inline: 20px; }
.rmsg { font-family: var(--font-display); font-style: italic; font-size: 21px; color: var(--glow); min-height: 1.4em; margin: 14px 0 0; }
.rhint { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.riddle .seal-btn { opacity: 1; width: 64px; height: 64px; margin-top: 24px; cursor: default; animation: sealpulse 3.2s ease-in-out infinite; }
.riddle .seal-btn::after { inset: 20px; }
.seal-btn.shake { animation: shake .5s ease !important; }

.postcard {
  border: 1px solid rgba(var(--rgb), .45); border-radius: 18px;
  padding: 26px 22px 26px;
  background: linear-gradient(160deg, #261d33, #181220);
}
.postcard .eyebrow { margin-bottom: 14px; }
.postcard .who { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(44px, 14vw, 58px); line-height: 1; margin: 0 0 6px; }
.postcard .sub2 { color: var(--muted); margin: 0 0 22px; }
.rows { margin: 0; display: grid; gap: 14px; }
.rows div { display: grid; gap: 2px; padding-top: 14px; border-top: 1px solid var(--line); min-width: 0; }
.rows dt { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.rows dd { margin: 0; overflow-wrap: anywhere; }
.sign { font-family: var(--font-display); font-style: italic; font-size: 24px; margin: 26px 0 0; line-height: 1.25; text-wrap: balance; }
.actions { display: grid; gap: 12px; margin-top: 26px; }
.actions .btn { width: 100%; box-sizing: border-box; }
.status { font-size: 14px; color: var(--glow); min-height: 1.5em; margin: 2px 0 0; }
.fallback { margin-top: 4px; }
.fallback textarea { min-height: 150px; }

.postcard.fold { animation: fold .65s ease forwards; }
@keyframes fold { to { transform: scale(.3) translateY(-40px); opacity: 0; } }
.sealed { position: relative; }
.stars { position: fixed; inset: 0; pointer-events: none; }
.stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--text); opacity: 0; animation: twinkle 3.5s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .75; } }
.env {
  position: relative; width: min(260px, 72vw); height: 170px; margin: 12vh auto 0;
  border: 1px solid rgba(var(--rgb), .5); border-radius: 10px;
  background: linear-gradient(160deg, #2a2036, #1b1424);
  box-shadow: 0 0 40px rgba(var(--rgb), .18);
  opacity: 0; animation: envin .8s ease forwards, fly 2.1s 3.2s ease-in forwards;
}
@keyframes envin { to { opacity: 1; } }
@keyframes fly { to { transform: translateY(-75vh) scale(.45); opacity: 0; } }
.flap {
  position: absolute; left: 0; right: 0; top: 0; height: 62%; background: #35293f;
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transform: scaleY(0);
  animation: flap .9s .8s ease forwards;
}
@keyframes flap { to { transform: scaleY(1); } }
.wax {
  position: absolute; left: 50%; top: 62%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border-radius: 50%; background: var(--glow); box-shadow: 0 0 26px rgba(var(--rgb), .75);
  transform: scale(0); animation: pop .5s 1.8s cubic-bezier(.2,1.6,.4,1) forwards;
}
@keyframes pop { to { transform: scale(1); } }
.after { display: grid; gap: 12px; margin-top: 40px; opacity: 0; animation: fadein 1.4s 4.6s ease forwards; }
.after .btn { width: 100%; box-sizing: border-box; }
.done { font-family: var(--font-display); font-style: italic; font-size: clamp(46px, 14vw, 62px); line-height: 1; margin: 0; }

/* Motion: titles resolve out of a soft blur, options arrive one after another, a choice sends out a ring of light, the postcard unfolds row by row. */
@keyframes soft { from { opacity: 0; filter: blur(6px); transform: translateY(8px); } }
@keyframes cardin { from { opacity: 0; transform: translateY(20px) scale(.97); } }
@keyframes sheen { to { transform: translateX(100%); } }
@keyframes ring { from { box-shadow: 0 0 0 0 rgba(var(--rgb), .55); } to { box-shadow: 0 0 0 14px rgba(var(--rgb), 0); } }
@keyframes ringdot {
  from { box-shadow: 0 0 0 3px var(--ink), 0 0 0 3px rgba(var(--rgb), .6); }
  to { box-shadow: 0 0 0 3px var(--ink), 0 0 0 16px rgba(var(--rgb), 0); }
}
@keyframes drift {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: .5; }
  90% { opacity: .22; }
  100% { transform: translate(var(--x), -110vh); opacity: 0; }
}
.step:not(.intro) .title { animation: soft .9s ease backwards; }
.step:not(.intro) .lead { animation: soft .9s .15s ease backwards; }
.opt, .swatch { animation: soft .65s calc(min(var(--i, 0), 14) * 55ms + 250ms) ease backwards; }
.field, .hint, .need { animation: soft .7s .5s ease backwards; }
.nav { animation: stepin .7s .6s ease backwards; }
.opt.pop { animation: ring .7s ease-out; }
.swatch.pop .dot { animation: ringdot .7s ease-out; }
.opt { transition: border-color .2s, background .2s, transform .15s; }
.opt:active { transform: scale(.985); }
.card .sw b { transition: width .45s ease; }
.card[aria-pressed="true"] .sw b { width: 42px; }
.card::after { transition: background .25s, border-color .25s, transform .3s; }
.card[aria-pressed="true"]::after { transform: scale(1.2); }
.btn { transition: transform .15s, box-shadow .3s, opacity .3s; }
.btn:active { transform: scale(.97); }
input[type="text"], textarea { transition: border-color .25s, box-shadow .25s; }
input[type="text"]:focus, textarea:focus { border-color: var(--glow); box-shadow: 0 0 0 4px rgba(var(--rgb), .14); }
@media (hover: hover) {
  .btn:not([disabled]):hover { box-shadow: 0 0 24px rgba(var(--rgb), .4); }
  .btn.ghost:hover { border-color: var(--glow); box-shadow: none; }
  .opt:hover { border-color: #5a4a6b; }
  .opt[aria-pressed="true"]:hover { border-color: var(--glow); }
}
.postcard { position: relative; overflow: hidden; animation: cardin 1.1s ease backwards; }
.postcard::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(110deg, transparent 35%, rgba(var(--rgb), .16) 50%, transparent 65%);
  transform: translateX(-100%); animation: sheen 1.8s .9s ease forwards;
}
.postcard .who, .postcard .sub2 { animation: soft .9s .5s ease backwards; }
.rows div { animation: soft .7s calc(var(--i, 0) * 90ms + 800ms) ease backwards; }
.sign { animation: soft .9s var(--sd, 1.8s) ease backwards; }
.motes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.motes i {
  position: absolute; bottom: -10px; width: var(--s); height: var(--s); border-radius: 50%;
  background: var(--glow); opacity: 0; animation: drift var(--d) linear var(--dl) infinite;
}
.spark { position: fixed; z-index: 50; width: 5px; height: 5px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 8px var(--glow); pointer-events: none; }
.spark.tiny { width: 3px; height: 3px; box-shadow: 0 0 6px var(--glow); }
.snd {
  position: fixed; z-index: 60; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  font: 500 12px/1 var(--font-body); color: var(--muted); background: rgba(20,16,27,.6);
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer;
}
.snd:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .step:not(.intro) .title, .step:not(.intro) .lead, .opt, .swatch, .field, .hint, .need, .nav,
  .postcard, .postcard::before, .postcard .who, .postcard .sub2, .rows div, .sign,
  .opt.pop, .swatch.pop .dot, .rline, .rform, .cons line.cur, .cons circle.cur, .cons circle.on { animation: none; }
  .motes { display: none; }
  .glow { transition: none; animation: none; }
  :root { transition: none; }
  .sealed .env, .sealed .after { animation: none; opacity: 1; }
  .flap, .wax { animation: none; transform: none; }
  .stars i { animation: none; opacity: .5; }
  .postcard.fold { animation: none; }
  .step, .eyebrow::after { animation: none; }
  .eyebrow::after { width: 56px; }
  .intro.ready .seal-btn, .intro.ready .seal-cap, .riddle .seal-btn { animation: none; opacity: 1; }
  .whisper.show { animation: none; opacity: 1; }
}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<body>
<div class="glow" aria-hidden="true"></div>
<main class="app" id="app"></main>

<script>
(function () {
  var KEY = 'katya-choices-v1';
  var SKEY = 'katya-solved-v1';
  var NKEY = 'katya-snd-v1';
  var app = document.getElementById('app');
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var state = {
    style: [], moods: [], colors: [], format: [], looks: [], size: '', avoid: '',
    makeup: [], hair: [], hairOwn: '', when: '', words: ''
  };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') {
      Object.keys(state).forEach(function (k) {
        if (k in saved && Array.isArray(saved[k]) === Array.isArray(state[k])) state[k] = saved[k];
      });
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /*H*/
  function cyrb53(str, seed) {
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);

      '<button type="submit" class="btn">Назвать</button></form>' +
      '<p class="rmsg" id="rmsg" role="status" aria-live="polite"></p>' +
      '<div id="rhints"></div>' +
      '<div class="seal-btn" id="rseal" role="img" aria-label="Печать"></div>' +
      '</section>';
  }

  function render() {
    clearTimeout(typingTimer);
    introTyping = false;
    try { document.documentElement.style.setProperty('--p', String(cur)); } catch (e) {}
    applyTheme();
    var st = STEPS[cur];
    var html = '';
    var inRiddle = false;
    if (st.id === 'intro') {
      if (riddleOpen && !riddleSolved && CONFIG.riddle && CONFIG.riddle.hash) {
        inRiddle = true;
        html = riddleHTML();
      } else {
        html = '<section class="step intro">' +
          '<div class="eyebrow">Письмо без подписи</div>' +
          '<h1 class="title">Катя.</h1>' +
          '<p class="line l1">Это письмо нашло тебя само.</p>' +
          '<p class="line l2">Тот, кто его написал, мечтает подарить тебе особенный день.</p>' +
          '<button type="button" class="seal-btn" data-act="open" aria-label="Сломать печать"></button>' +
          '<p class="seal-cap">Сломай печать</p>' +
          '</section>';
      }
    } else if (st.id === 'card') {
      var rows = rowsData().map(function (p, i) {
        return '<div style="--i:' + i + '"><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>';
      }).join('');
      var sd = (1.1 + rowsData().length * 0.09).toFixed(2) + 's';
      var href = tgHref();
      html = '<section class="step">' +
        '<article class="postcard">' +
        consHTML(FORM_STEPS, true) +
        '<div class="eyebrow">Письмо без подписи</div>' +
        '<h1 class="who">Катя</h1>' +
        '<p class="sub2">Твоя съёмка почти готова.</p>' +
        '<dl class="rows">' + rows + '</dl>' +
        '<p class="sign" style="--sd:' + sd + '">Остальное моя забота.<br>Твой тайный поклонник</p>' +
        '</article>' +
        '<div class="actions">' +
        '<button type="button" class="btn" data-act="seal">Запечатать письмо</button>' +
        '<button type="button" class="link" data-act="edit">Изменить ответы</button>' +
        '</div></section>';
      if (sealed) html = sealedHTML(href);
    } else {
      html = '<section class="step">' + consHTML(cur, false) +
        '<h2 class="title">' + esc(st.title) + '</h2>' +
        '<p class="lead">' + esc(st.lead) + '</p>';
      var off = 0;
      (st.groups || []).forEach(function (k) { html += groupHTML(G[k], off); off += G[k].options.length; });
      if (st.fields) {
        html += '<div class="group">' + st.fields.map(function (f) {
          return '<div class="field"><label for="f-' + f.f + '">' + esc(f.label) + '</label>' +
            '<input type="text" id="f-' + f.f + '" data-f="' + f.f + '" value="' + esc(state[f.f]) + '" placeholder="' + esc(f.ph) + '" autocomplete="off"></div>';
        }).join('') + '</div>';
      }
      if (st.textarea) {
        var ta = st.textarea;
        html += '<div class="field"><label for="f-' + ta.f + '">' + esc(ta.label) + '</label>' +
          '<textarea id="f-' + ta.f + '" data-f="' + ta.f + '" rows="' + ta.rows + '" placeholder="' + esc(ta.ph) + '">' + esc(state[ta.f]) + '</textarea></div>';
      }
      if (st.hint) html += '<p class="hint">' + esc(st.hint) + '</p>';
      html += '<p class="whisper" id="whisper" aria-hidden="true"></p>' +
        '<p class="need" id="need" aria-live="polite"></p>' +
        '<div class="nav"><button type="button" class="link" data-act="back">Назад</button>' +
        '<button type="button" class="btn" id="next" data-act="next">' + (st.id === 'words' ? 'Показать итог' : 'Дальше') + '</button></div>' +
        '</section>';
    }
    app.innerHTML = html;
    updateNext();
    if (st.id === 'intro' && !inRiddle) typeIntro();
  }

  function updateNext() {
    var st = STEPS[cur];
    var btn = document.getElementById('next');
    var need = document.getElementById('need');
    if (!btn) return;
    var msg = st.need ? st.need() : '';
    btn.disabled = !!msg;
    if (need) need.textContent = msg;
  }

  var busy = false;
  function go(n) {
    if (busy) return;
    var el = app.querySelector('.step');
    if (!el || reduce) {
      cur = n;
      render();
      try { window.scrollTo(0, 0); } catch (e) {}
      return;
    }
    busy = true;
    el.classList.add('leave');
    setTimeout(function () {
      busy = false;
      cur = n;
      render();
      try { window.scrollTo(0, 0); } catch (e) {}
    }, 260);
  }

  function whisper(key, v) {
    var el = document.getElementById('whisper');
    if (!el) return;
    var src = WHISPERS[key], txt = '';
    if (Array.isArray(src)) txt = src[Math.floor(Math.random() * src.length)];
    else if (src) txt = src[v] || '';
    if (!txt) return;
    el.textContent = txt;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }

  function toggle(btn) {
    var key = btn.getAttribute('data-k');
    var v = btn.getAttribute('data-v');
    var g = G[key];
    var arr = state[key];
    var i = arr.indexOf(v);
    if (i >= 0) arr.splice(i, 1);
    else { arr.push(v); if (arr.length > g.max) arr.shift(); }
    var nodes = app.querySelectorAll('[data-k="' + key + '"]');
    for (var n = 0; n < nodes.length; n++) {
      nodes[n].setAttribute('aria-pressed', arr.indexOf(nodes[n].getAttribute('data-v')) >= 0 ? 'true' : 'false');
    }
    if (arr.indexOf(v) >= 0) {
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
      whisper(key, v);
    }
    if (key === 'style') applyTheme();
    save();
    updateNext();
  }

  function flash(msg) {
    var s = document.getElementById('status');
    if (s) s.textContent = msg;
  }
  function showFallback() {
    var box = document.getElementById('fallback');
    var ta = document.getElementById('fbtext');
    if (!box || !ta) return;
    ta.value = messageText();
    box.hidden = false;
    ta.focus();
    ta.select();
    flash('Выдели текст ниже, скопируй и отправь в чат, где пришла ссылка.');
  }
  function seal() {
    var pc = app.querySelector('.postcard');
    if (pc && pc.classList.contains('fold')) return;
    if (CONFIG.endpoint && sendState !== 'ok' && sendState !== 'sending') send();
    if (pc && !reduce) {
      pc.classList.add('fold');
      setTimeout(function () {
        sealed = true;
        render();
        chime('soft');
        try { window.scrollTo(0, 0); } catch (e) {}
      }, 650);
    } else {
      sealed = true;
      render();
    }
  }

  function crackSeal(el, done, delay) {
    el.classList.remove('shake');
    el.classList.add('crack');
    burstFrom(el);
    chime('open');
    buzz(40);
    setTimeout(done, reduce ? Math.min(delay, 300) : delay);
  }
  function openSeal(btn) {
    if (busy || btn.classList.contains('crack') || btn.classList.contains('shake')) return;
    if (CONFIG.riddle && CONFIG.riddle.hash && !riddleSolved) {
      riddleOpen = true;
      if (reduce) { render(); return; }
      btn.classList.add('shake');
      chime('low');
      buzz(40);
      setTimeout(render, 520);
      return;
    }
    crackSeal(btn, function () { go(1); }, 650);
  }

  function addHint(text) {
    var box = document.getElementById('rhints');
    if (!box || !text) return;
    var p = document.createElement('p');
    p.className = 'rhint';
    p.textContent = text;
    box.appendChild(p);
  }
  function unlockRiddle(seal, inp) {
    riddleSolved = true;
    try { localStorage.setItem(SKEY, '1'); } catch (e) {}
    if (inp) inp.disabled = true;
    var btn = document.querySelector('#riddle-form .btn');
    if (btn) btn.disabled = true;
    crackSeal(seal, function () { riddleOpen = false; go(1); }, 1700);
  }
  function checkRiddle() {
    var inp = document.getElementById('riddle-in');
    var msg = document.getElementById('rmsg');
    var seal = document.getElementById('rseal');
    if (!inp || !msg || !seal || seal.classList.contains('crack')) return;
    if (!inp.value.trim()) { msg.textContent = 'Назови день.'; return; }
    var val = normDate(inp.value);
    if (!val) { msg.textContent = 'Напиши день и месяц, например 14.03.'; return; }
    if (cyrb53('katya|' + val, 7) === CONFIG.riddle.hash) {
      msg.textContent = 'Помнишь. Значит, ты знаешь, кто пишет.';
      unlockRiddle(seal, inp);
      return;
    }
    riddleErrors++;
    if (riddleErrors >= 5) {
      msg.textContent = 'Печать сжалилась.';
      unlockRiddle(seal, inp);
      return;
    }
    var pool = ['Печать дрогнула, но не поддалась.', 'Она слушает. Но это не тот день.', 'Нет. Попробуй вспомнить ещё.'];
    msg.textContent = pool[(riddleErrors - 1) % pool.length];
    seal.classList.remove('shake');
    void seal.offsetWidth;
    seal.classList.add('shake');
    chime('low');
    buzz(60);
    if (riddleErrors === 2) addHint(CONFIG.riddle.hint1);
    if (riddleErrors === 4) addHint(CONFIG.riddle.hint2);
    inp.select();
  }

  function copyChoice() {
    try {
      navigator.clipboard.writeText(messageText()).then(function () {
        flash('Скопировано. Вставь в чат, где пришла ссылка.');
      }, showFallback);
    } catch (e) { showFallback(); }
  }

  app.addEventListener('click', function (e) {
    ensureAudio();
    var opt = e.target.closest('[data-k]');
    if (opt) { toggle(opt); return; }
    var act = e.target.closest('[data-act]');
    if (!act) { if (introTyping) introFinish(); return; }
    var a = act.getAttribute('data-act');
    if (a === 'next') { if (!act.disabled) go(cur + 1); }
    else if (a === 'back') go(cur - 1);
    else if (a === 'edit' || a === 'unseal') { sealed = false; go(1); }
    else if (a === 'seal') seal();
    else if (a === 'open') openSeal(act);
    else if (a === 'copy') copyChoice();
  });
  app.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'riddle-form') { e.preventDefault(); ensureAudio(); checkRiddle(); }
  });
  app.addEventListener('input', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-f');
    if (f) { state[f] = e.target.value; save(); updateNext(); }
  });

  var snd = document.createElement('button');
  snd.type = 'button';
  snd.className = 'snd';
  function paintSnd() {
    snd.textContent = sndOn ? 'Звук: вкл' : 'Звук: выкл';
    snd.setAttribute('aria-pressed', sndOn ? 'true' : 'false');
  }
  paintSnd();
  snd.addEventListener('click', function () {
    sndOn = !sndOn;
    try { localStorage.setItem(NKEY, sndOn ? '1' : '0'); } catch (e) {}
    paintSnd();
    ensureAudio();
    if (sndOn) chime('soft');
  });
  document.body.appendChild(snd);

  var motes = document.createElement('div');
  motes.className = 'motes';
  motes.setAttribute('aria-hidden', 'true');
  var mh = '';
  for (var m = 0; m < 16; m++) {
    var dur = 16 + ((m * 5) % 9);
    mh += '<i style="left:' + ((m * 61 + 13) % 100) + '%;--s:' + (2 + ((m * 7) % 3)) + 'px;--d:' + dur + 's;--dl:-' + ((m * 2.3) % dur).toFixed(1) + 's;--x:' + ((m % 2 ? 1 : -1) * (10 + ((m * 13) % 40))) + 'px"></i>';
  }
  motes.innerHTML = mh;
  document.body.insertBefore(motes, app);

  render();
})();
</script>

</body>
</html>
