<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Для Кати</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one quiet screen per question. A single soft point of light hangs above the column, content sits below it, navigation is pinned to the bottom of the column. Committed to one night-time look on purpose: warm candle accent on deep plum-black. */
:root {
  --ink: #14101b;
  --ink-2: #1d1726;
  --ink-3: #2a2236;
  --line: #3a3047;
  --text: #f2e9df;
  --muted: #a699b2;
  --glow: #e9b98b;
  --glow-ink: #1a1320;
  --font-display: 'Cormorant Garamond', 'Iowan Old Style', 'Times New Roman', serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html { height: 100%; background: var(--ink); overflow-x: hidden; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--ink);
  color: var(--text);
  font: 400 16px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.glow {
  position: fixed; left: calc(50% + var(--p, 0) * 2%); top: calc(-18vh + var(--p, 0) * 1.5vh);
  filter: hue-rotate(calc(var(--p, 0) * -5deg));
  transition: left 1.4s ease, top 1.4s ease, filter 1.4s ease;
  width: 130vw; max-width: 900px; aspect-ratio: 1;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(233,185,139,.22), rgba(233,185,139,.07) 55%, transparent);
  pointer-events: none; z-index: 0;
  animation: breathe 10s ease-in-out infinite alternate;
}
@keyframes breathe {
  from { opacity: .65; transform: translateX(-50%) scale(.96); }
  to { opacity: 1; transform: translateX(-50%) scale(1.04); }
}
.app {
  position: relative; z-index: 1;
  max-width: 460px; margin: 0 auto;
  min-height: 80vh;
  min-height: calc(100dvh - 48px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
}
.progress { display: flex; gap: 6px; margin-bottom: 30px; }
.progress i { flex: 1; height: 2px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
.progress i::after { content: ""; position: absolute; inset: 0; background: var(--glow); transform: scaleX(0); transform-origin: left; }
.progress i.on::after { transform: scaleX(1); }
.progress i.cur::after { animation: fill .9s .25s ease backwards; }
@keyframes fill { from { transform: scaleX(0); } }

.step { flex: 1; display: flex; flex-direction: column; animation: stepin .4s ease backwards; }
.step.leave { animation: leave .26s ease forwards; }
@keyframes stepin { from { opacity: 0; } }
@keyframes leave { to { opacity: 0; transform: translateY(-8px); } }

.title {
  font-family: var(--font-display); font-weight: 500;
  font-size: clamp(34px, 10vw, 44px); line-height: 1.08;
  margin: 0 0 10px; text-wrap: balance;
}
.lead { color: var(--muted); margin: 0 0 26px; max-width: 38ch; text-wrap: pretty; }
.group + .group { margin-top: 28px; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.hint { font-size: 13px; color: var(--muted); margin: 12px 0 0; max-width: 40ch; }

.cards { display: grid; gap: 10px; }
.opt {
  font: inherit; color: inherit; text-align: left;
  background: var(--ink-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; cursor: pointer; position: relative;
  transition: border-color .2s, background .2s;
}
.opt[aria-pressed="true"] { border-color: var(--glow); background: var(--ink-3); }
.opt:focus-visible, .swatch:focus-visible .dot { outline: 2px solid var(--glow); outline-offset: 3px; }
.card .name { font-family: var(--font-display); font-size: 27px; font-weight: 600; line-height: 1.1; display: block; }
.card .sub { display: block; color: var(--muted); font-size: 14px; margin-top: 5px; padding-right: 30px; text-wrap: pretty; }
.card .sw { display: flex; gap: 6px; margin-top: 13px; }
.card .sw b { width: 28px; height: 10px; border-radius: 5px; display: block; }
.card::after {
  content: ""; position: absolute; top: 18px; right: 16px;
  width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line);
}
.card[aria-pressed="true"]::after { background: var(--glow); border-color: var(--glow); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 999px; padding: 10px 16px; font-size: 15px; }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 14px 8px; }
.swatch {
  background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer;
}
.swatch .dot { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); box-shadow: 0 0 0 3px var(--ink); transition: box-shadow .2s; }
.swatch[aria-pressed="true"] { color: var(--text); }
.swatch[aria-pressed="true"] .dot { box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--glow); }

.field { display: grid; gap: 6px; }
.field + .field { margin-top: 16px; }
.field label { font-size: 13px; color: var(--muted); }
input[type="text"], textarea {
  font: inherit; font-size: 16px; color: var(--text);
  background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; width: 100%; box-sizing: border-box; resize: vertical;
}
input[type="text"]::placeholder, textarea::placeholder { color: #6f6580; }
input[type="text"]:focus-visible, textarea:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 34px; }
.btn {
  font: 600 16px/1 var(--font-body); border: 0; border-radius: 999px;
  padding: 15px 26px; cursor: pointer; background: var(--glow); color: var(--glow-ink);
  text-decoration: none; display: inline-block; text-align: center;
}
.btn[disabled] { opacity: .35; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.link { background: none; border: 0; color: var(--muted); font: inherit; padding: 12px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
.link:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.need { font-size: 13px; color: var(--muted); min-height: 1.4em; margin: 16px 0 0; }

.intro { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 6vh; }
.eyebrow { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--glow); display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.eyebrow::after { content: ""; height: 1px; width: 0; background: var(--glow); animation: draw 1.6s .4s ease forwards; }
@keyframes draw { to { width: 56px; } }
.intro .title { font-size: clamp(60px, 20vw, 88px); font-style: italic; line-height: .98; margin-bottom: 26px; }
.intro .line { font-family: var(--font-display); font-size: clamp(24px, 7vw, 30px); line-height: 1.25; margin: 0 0 8px; opacity: 0; animation: fadein 1.6s ease forwards; }
.intro .line.l1 { animation-delay: 1.1s; }
.intro .line.l2 { animation-delay: 3s; color: var(--glow); font-style: italic; }
.intro .btn { align-self: flex-start; margin-top: 32px; opacity: 0; animation: fadein 1.4s 4.4s ease forwards, btnglow 3.2s 6s ease-in-out infinite; }
@keyframes btnglow { 0%, 100% { box-shadow: 0 0 0 0 rgba(233,185,139,0); } 50% { box-shadow: 0 0 26px 2px rgba(233,185,139,.45); } }
@keyframes fadein { to { opacity: 1; } }

.postcard {
  border: 1px solid rgba(233,185,139,.45); border-radius: 18px;
  padding: 30px 22px 26px;
  background: linear-gradient(160deg, #261d33, #181220);
}
.postcard .eyebrow { margin-bottom: 14px; }
.postcard .who { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(44px, 14vw, 58px); line-height: 1; margin: 0 0 6px; }
.postcard .sub2 { color: var(--muted); margin: 0 0 22px; }
.rows { margin: 0; display: grid; gap: 14px; }
.rows div { display: grid; gap: 2px; padding-top: 14px; border-top: 1px solid var(--line); min-width: 0; }
.rows dt { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.rows dd { margin: 0; overflow-wrap: anywhere; }
.sign { font-family: var(--font-display); font-style: italic; font-size: 24px; margin: 26px 0 0; line-height: 1.25; text-wrap: balance; }
.actions { display: grid; gap: 12px; margin-top: 26px; }
.actions .btn { width: 100%; box-sizing: border-box; }
.status { font-size: 14px; color: var(--glow); min-height: 1.5em; margin: 2px 0 0; }
.fallback { margin-top: 4px; }
.fallback textarea { min-height: 150px; }

.postcard.fold { animation: fold .65s ease forwards; }
@keyframes fold { to { transform: scale(.3) translateY(-40px); opacity: 0; } }
.sealed { position: relative; }
.stars { position: fixed; inset: 0; pointer-events: none; }
.stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--text); opacity: 0; animation: twinkle 3.5s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .75; } }
.env {
  position: relative; width: min(260px, 72vw); height: 170px; margin: 12vh auto 0;
  border: 1px solid rgba(233,185,139,.5); border-radius: 10px;
  background: linear-gradient(160deg, #2a2036, #1b1424);
  box-shadow: 0 0 40px rgba(233,185,139,.18);
  opacity: 0; animation: envin .8s ease forwards, fly 2.1s 3.2s ease-in forwards;
}
@keyframes envin { to { opacity: 1; } }
@keyframes fly { to { transform: translateY(-75vh) scale(.45); opacity: 0; } }
.flap {
  position: absolute; left: 0; right: 0; top: 0; height: 62%; background: #35293f;
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transform: scaleY(0);
  animation: flap .9s .8s ease forwards;
}
@keyframes flap { to { transform: scaleY(1); } }
.wax {
  position: absolute; left: 50%; top: 62%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
  border-radius: 50%; background: var(--glow); box-shadow: 0 0 26px rgba(233,185,139,.75);
  transform: scale(0); animation: pop .5s 1.8s cubic-bezier(.2,1.6,.4,1) forwards;
}
@keyframes pop { to { transform: scale(1); } }
.after { display: grid; gap: 12px; margin-top: 40px; opacity: 0; animation: fadein 1.4s 4.6s ease forwards; }
.after .btn { width: 100%; box-sizing: border-box; }
.done { font-family: var(--font-display); font-style: italic; font-size: clamp(46px, 14vw, 62px); line-height: 1; margin: 0; }

/* Motion: titles resolve out of a soft blur, options arrive one after another, a choice sends out a ring of light, the postcard unfolds row by row. */
@keyframes soft { from { opacity: 0; filter: blur(6px); transform: translateY(8px); } }
@keyframes cardin { from { opacity: 0; transform: translateY(20px) scale(.97); } }
@keyframes sheen { to { transform: translateX(100%); } }
@keyframes ring { from { box-shadow: 0 0 0 0 rgba(233,185,139,.55); } to { box-shadow: 0 0 0 14px rgba(233,185,139,0); } }
@keyframes ringdot {
  from { box-shadow: 0 0 0 3px var(--ink), 0 0 0 3px rgba(233,185,139,.6); }
  to { box-shadow: 0 0 0 3px var(--ink), 0 0 0 16px rgba(233,185,139,0); }
}
@keyframes drift {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: .5; }
  90% { opacity: .22; }
  100% { transform: translate(var(--x), -110vh); opacity: 0; }
}
.step:not(.intro) .title { animation: soft .9s ease backwards; }
.step:not(.intro) .lead { animation: soft .9s .15s ease backwards; }
.opt, .swatch { animation: soft .65s calc(min(var(--i, 0), 14) * 55ms + 250ms) ease backwards; }
.field, .hint, .need { animation: soft .7s .5s ease backwards; }
.nav { animation: stepin .7s .6s ease backwards; }
.opt.pop { animation: ring .7s ease-out; }
.swatch.pop .dot { animation: ringdot .7s ease-out; }
.opt { transition: border-color .2s, background .2s, transform .15s; }
.opt:active { transform: scale(.985); }
.card .sw b { transition: width .45s ease; }
.card[aria-pressed="true"] .sw b { width: 42px; }
.card::after { transition: background .25s, border-color .25s, transform .3s; }
.card[aria-pressed="true"]::after { transform: scale(1.2); }
.btn { transition: transform .15s, box-shadow .3s, opacity .3s; }
.btn:active { transform: scale(.97); }
input[type="text"], textarea { transition: border-color .25s, box-shadow .25s; }
input[type="text"]:focus, textarea:focus { border-color: var(--glow); box-shadow: 0 0 0 4px rgba(233,185,139,.14); }
@media (hover: hover) {
  .btn:not([disabled]):hover { box-shadow: 0 0 24px rgba(233,185,139,.4); }
  .btn.ghost:hover { border-color: var(--glow); box-shadow: none; }
  .opt:hover { border-color: #5a4a6b; }
  .opt[aria-pressed="true"]:hover { border-color: var(--glow); }
}
.postcard { position: relative; overflow: hidden; animation: cardin 1.1s ease backwards; }
.postcard::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(110deg, transparent 35%, rgba(233,185,139,.16) 50%, transparent 65%);
  transform: translateX(-100%); animation: sheen 1.8s .9s ease forwards;
}
.postcard .who, .postcard .sub2 { animation: soft .9s .5s ease backwards; }
.rows div { animation: soft .7s calc(var(--i, 0) * 90ms + 800ms) ease backwards; }
.sign { animation: soft .9s var(--sd, 1.8s) ease backwards; }
.motes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.motes i {
  position: absolute; bottom: -10px; width: var(--s); height: var(--s); border-radius: 50%;
  background: var(--glow); opacity: 0; animation: drift var(--d) linear var(--dl) infinite;
}

@media (prefers-reduced-motion: reduce) {
  .step:not(.intro) .title, .step:not(.intro) .lead, .opt, .swatch, .field, .hint, .need, .nav,
  .postcard, .postcard::before, .postcard .who, .postcard .sub2, .rows div, .sign,
  .opt.pop, .swatch.pop .dot, .progress i.cur::after { animation: none; }
  .motes { display: none; }
  .glow { transition: none; }
  .sealed .env, .sealed .after { animation: none; opacity: 1; }
  .flap, .wax { animation: none; transform: none; }
  .stars i { animation: none; opacity: .5; }
  .postcard.fold { animation: none; }
  .glow, .step, .eyebrow::after { animation: none; }
  .eyebrow::after { width: 56px; }
  .intro .line, .intro .btn { animation: none; opacity: 1; }
}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<body>
<div class="glow" aria-hidden="true"></div>
<main class="app" id="app"></main>

<script>
(function () {
  var KEY = 'katya-choices-v1';
  var app = document.getElementById('app');

  var state = {
    style: [], moods: [], colors: [], format: [], looks: [], size: '', avoid: '',
    makeup: [], hair: [], hairOwn: '', when: '', words: ''
  };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') {
      Object.keys(state).forEach(function (k) {
        if (k in saved && Array.isArray(saved[k]) === Array.isArray(state[k])) state[k] = saved[k];
      });
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var G = {
    style: { key: 'style', kind: 'card', max: 2, options: [
      { v: 'Нежный', sub: 'Мягкий свет, воздух, тихие цвета', sw: ['#f3dfd8', '#d9b8b0', '#b9a2b8'] },
      { v: 'Дерзкий', sub: 'Контраст, прямой взгляд, характер', sw: ['#120b0e', '#7a1228', '#e0603f'] },
      { v: 'Классика', sub: 'Как кадр из старого фильма: тёплый свет, строгие линии, спокойный взгляд', sw: ['#efe6d4', '#3a2f2a', '#a67c52'] },
      { v: 'Минимализм', sub: 'Светлый чистый фон, простая одежда, весь кадр про лицо и свет', sw: ['#f4f4f1', '#c9c7c2', '#2b2b2b'] }
    ] },
    moods: { key: 'moods', kind: 'chip', max: 3, label: 'Настроение', options: [
      { v: 'уютно' }, { v: 'спокойно' }, { v: 'романтично' }, { v: 'загадочно' },
      { v: 'смело' }, { v: 'игриво' }, { v: 'кинематографично' }, { v: 'свободно' }
    ] },
    colors: { key: 'colors', kind: 'swatch', max: 3, label: 'Цвета', options: [
      { v: 'Молочный', c: '#f1e9dc' }, { v: 'Пудровый', c: '#dfc0b7' }, { v: 'Шоколад', c: '#4a3228' },
      { v: 'Чёрный', c: '#121114' }, { v: 'Бордо', c: '#6e1a2c' }, { v: 'Изумруд', c: '#134e43' },
      { v: 'Графит', c: '#3b3f48' }, { v: 'Золото', c: '#c49a4a' }, { v: 'Небесный', c: '#9db8d4' },
      { v: 'Лаванда', c: '#b2a1cf' }
    ] },
    format: { key: 'format', kind: 'card', max: 1, options: [
      { v: 'Студия' },
      { v: 'Природа' },
      { v: 'Автопортретная студия' }
    ] },
    looks: { key: 'looks', kind: 'chip', max: 2, label: 'Направление', options: [
      { v: 'Платье' }, { v: 'Пальто и трикотаж' }, { v: 'Спорт-шик' },
      { v: 'Строгий костюм' }, { v: 'Джинсы и белая рубашка' }, { v: 'Удиви меня' }
    ] },
    makeup: { key: 'makeup', kind: 'chip', max: 1, label: 'Макияж', options: [
      { v: 'Без макияжа' }, { v: 'Лёгкий, чуть подчеркнуть' }, { v: 'Выразительный' }
    ] },
    hair: { key: 'hair', kind: 'chip', max: 1, label: 'Причёска', options: [
      { v: 'Распущенные' }, { v: 'Локоны' }, { v: 'Собранные' }, { v: 'Хвост' }, { v: 'Косы' }, { v: 'Как посоветует мастер' }
    ] }
  };

  var STEPS = [
    { id: 'intro' },
    { id: 'style', title: 'Какой должна быть съёмка?', lead: 'Выбери один стиль или два, если хочется смешать.',
      groups: ['style'], need: function () { return state.style.length ? '' : 'Выбери хотя бы один стиль.'; } },
    { id: 'mood', title: 'Настроение и цвета', lead: 'Что тебе близко сейчас. Выбирай по ощущению, до трёх вариантов в каждом.',
      groups: ['moods', 'colors'] },
    { id: 'format', title: 'Где снимаем?', lead: 'Выбери одно.',
      groups: ['format'], need: function () { return state.format.length ? '' : 'Выбери формат.'; } },
    { id: 'look', title: 'Образ', lead: 'Выбери направление. Остальное останется сюрпризом.',
      groups: ['looks'], fields: [
        { f: 'size', label: 'Размер одежды', ph: 'Размер и любой комментарий' },
        { f: 'avoid', label: 'Чего точно не надевать', ph: 'Цвета, фасоны, ткани' }
      ] },
    { id: 'beauty', title: 'Макияж и причёска', lead: 'Выбери то, что тебе ближе.',
      groups: ['makeup', 'hair'], fields: [
        { f: 'hairOwn', label: 'Свой вариант причёски', ph: 'Если нужного нет в списке' }
      ] },
    { id: 'when', title: 'Когда?', lead: 'Напиши, когда тебе удобнее. Дальше всё согласую я.',
      textarea: { f: 'when', label: 'Когда удобно', ph: 'Например, суббота днём или любой будний вечер', rows: 3 },
      need: function () { return state.when.trim() ? '' : 'Напиши пару слов о времени.'; } },
    { id: 'words', title: 'Что-нибудь ещё?', lead: 'Всё, что хочешь добавить: пожелания, страхи, песня для настроения. Можно оставить пустым.',
      textarea: { f: 'words', label: 'Твои слова', ph: 'Что угодно', rows: 6 } },
    { id: 'card' }
  ];
  var FORM_STEPS = 7;
  var cur = 0;
  var sealed = false;
  /* Куда улетает письмо. Впиши адрес сервиса форм (Formspree: https://formspree.io/f/xxxx,
     Web3Forms: https://api.web3forms.com/submit и свой accessKey). Пусто: работает запасной путь через Telegram. */
  var CONFIG = { endpoint: 'https://api.web3forms.com/submit', accessKey: 'b93c3d21-7429-4375-abfe-4eb508d9f520' };
  var sendState = CONFIG.endpoint ? 'idle' : 'manual';

  function groupHTML(g, off) {
    var label = g.label ? '<p class="label">' + esc(g.label) + '</p>' : '';
    var pressed = function (o) { return state[g.key].indexOf(o.v) >= 0 ? 'true' : 'false'; };
    var attrs = function (o) {
      return 'data-k="' + g.key + '" data-v="' + esc(o.v) + '" aria-pressed="' + pressed(o) + '" style="--i:' + ((off || 0) + g.options.indexOf(o)) + '"';
    };
    var body;
    if (g.kind === 'card') {
      body = '<div class="cards">' + g.options.map(function (o) {
        var sw = o.sw ? '<span class="sw">' + o.sw.map(function (c) { return '<b style="background:' + c + '"></b>'; }).join('') + '</span>' : '';
        return '<button type="button" class="opt card" ' + attrs(o) + '><span class="name">' + esc(o.v) + '</span>' + (o.sub ? '<span class="sub">' + esc(o.sub) + '</span>' : '') + sw + '</button>';
      }).join('') + '</div>';
    } else if (g.kind === 'swatch') {
      body = '<div class="swatches">' + g.options.map(function (o) {
        return '<button type="button" class="swatch" ' + attrs(o) + '><span class="dot" style="background:' + o.c + '"></span>' + esc(o.v) + '</button>';
      }).join('') + '</div>';
    } else {
      body = '<div class="chips">' + g.options.map(function (o) {
        return '<button type="button" class="opt chip" ' + attrs(o) + '>' + esc(o.v) + '</button>';
      }).join('') + '</div>';
    }
    return '<div class="group">' + label + body + '</div>';
  }

  function ordered(key) {
    var chosen = state[key];
    return G[key].options.map(function (o) { return o.v; }).filter(function (v) { return chosen.indexOf(v) >= 0; });
  }

  function rowsData() {
    var r = [];
    function add(label, value) { if (value && String(value).trim()) r.push([label, String(value).trim()]); }
    add('Стиль', ordered('style').join(' + '));
    add('Настроение', ordered('moods').join(', '));
    add('Цвета', ordered('colors').join(', '));
    add('Формат', ordered('format').join(''));
    add('Образ', ordered('looks').join(', '));
    add('Размер', state.size);
    add('Не надевать', state.avoid);
    add('Макияж', ordered('makeup').join(''));
    add('Причёска', [ordered('hair').join(''), state.hairOwn.trim()].filter(Boolean).join('. '));
    add('Когда удобно', state.when);
    add('Пожелания', state.words);
    return r;
  }
  function messageText() {
    return 'Мой выбор для фотосессии:\n' + rowsData().map(function (p) { return p[0] + ': ' + p[1]; }).join('\n');
  }

  function progressHTML(i) {
    var s = '';
    for (var n = 1; n <= FORM_STEPS; n++) s += '<i class="' + (n < i ? 'on' : n === i ? 'on cur' : '') + '"></i>';
    return '<div class="progress" aria-hidden="true">' + s + '</div>';
  }

  function sealedHTML(href) {
    var stars = '';
    var pts = [[8,12],[22,6],[35,18],[48,9],[63,15],[77,7],[90,19],[14,30],[41,27],[70,31],[86,38],[5,45],[28,52],[57,44],[93,55]];
    pts.forEach(function (p, i) {
      stars += '<i style="left:' + p[0] + '%;top:' + p[1] + '%;animation-delay:' + ((i % 5) * 0.7) + 's"></i>';
    });
    return '<section class="step sealed">' +
      '<div class="stars" aria-hidden="true">' + stars + '</div>' +
      '<div class="env" aria-hidden="true"><div class="flap"></div><div class="wax"></div></div>' +
      '<div class="after" id="after">' + afterHTML(href) + '</div></section>';
  }

  function afterHTML(href) {
    if (sendState === 'sending') {
      return '<p class="done">Запечатано.</p><p class="lead" style="margin:0">Письмо летит…</p>';
    }
    if (sendState === 'ok') {
      return '<p class="done">Письмо улетело.</p><p class="lead" style="margin:0">Дальше моя забота.</p>';
    }
    var intro = sendState === 'fail'
      ? 'Письмо не долетело, такое бывает. Отдай его мне сама: откроется Telegram, выбери чат со мной и нажми «Отправить».'
      : 'Осталось отдать письмо мне. Откроется Telegram: выбери чат со мной и нажми «Отправить».';
    return '<p class="done">Запечатано.</p>' +
      '<p class="lead" style="margin:0">' + intro + '</p>' +
      '<a class="btn" href="' + esc(href) + '" target="_blank" rel="noopener">Отдать Илье</a>' +
      '<button type="button" class="btn ghost" data-act="copy">Скопировать выбор</button>' +
      '<p class="status" id="status" role="status" aria-live="polite"></p>' +
      '<div class="fallback" id="fallback" hidden><textarea id="fbtext" readonly></textarea></div>' +
      '<button type="button" class="link" data-act="unseal">Изменить ответы</button>';
  }

  function tgHref() {
    return 'https://t.me/share/url?url=&text=' + encodeURIComponent(messageText());
  }
  function refreshAfter() {
    var box = document.getElementById('after');
    if (box) box.innerHTML = afterHTML(tgHref());
  }
  function send() {
    if (!CONFIG.endpoint) return;
    sendState = 'sending';
    var body = {
      subject: 'Катя выбрала фотосессию',
      _subject: 'Катя выбрала фотосессию',
      message: messageText()
    };
    if (CONFIG.accessKey) body.access_key = CONFIG.accessKey;
    rowsData().forEach(function (p) { body[p[0]] = p[1]; });
    fetch(CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      sendState = r.ok ? 'ok' : 'fail';
      refreshAfter();
    }, function () {
      sendState = 'fail';
      refreshAfter();
    });
  }

  function render() {
    try { document.documentElement.style.setProperty('--p', String(cur)); } catch (e) {}
    var st = STEPS[cur];
    var html = '';
    if (st.id === 'intro') {
      html = '<section class="step intro">' +
        '<h1 class="title">Катя.</h1>' +
        '<p class="line l1">Я кое-что придумал для тебя.</p>' +
        '<p class="line l2">Но без тебя это не получится.</p>' +
        '<button type="button" class="btn" data-act="next">Открыть</button>' +
        '</section>';
    } else if (st.id === 'card') {
      var rows = rowsData().map(function (p, i) {
        return '<div style="--i:' + i + '"><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>';
      }).join('');
      var sd = (1.1 + rowsData().length * 0.09).toFixed(2) + 's';
      var href = 'https://t.me/share/url?url=&text=' + encodeURIComponent(messageText());
      html = '<section class="step">' +
        '<article class="postcard">' +
        '<div class="eyebrow">27 ноября · с днём рождения</div>' +
        '<h1 class="who">Катя</h1>' +
        '<p class="sub2">Твоя фотосессия. Выбор сделан.</p>' +
        '<dl class="rows">' + rows + '</dl>' +
        '<p class="sign" style="--sd:' + sd + '">Остальное моя забота.<br>Илья</p>' +
        '</article>' +
        '<div class="actions">' +
        '<button type="button" class="btn" data-act="seal">Запечатать письмо</button>' +
        '<button type="button" class="link" data-act="edit">Изменить ответы</button>' +
        '</div></section>';
      if (sealed) html = sealedHTML(href);
    } else {
      html = '<section class="step">' + progressHTML(cur) +
        '<h2 class="title">' + esc(st.title) + '</h2>' +
        '<p class="lead">' + esc(st.lead) + '</p>';
      var off = 0;
      (st.groups || []).forEach(function (k) { html += groupHTML(G[k], off); off += G[k].options.length; });
      if (st.fields) {
        html += '<div class="group">' + st.fields.map(function (f) {
          return '<div class="field"><label for="f-' + f.f + '">' + esc(f.label) + '</label>' +
            '<input type="text" id="f-' + f.f + '" data-f="' + f.f + '" value="' + esc(state[f.f]) + '" placeholder="' + esc(f.ph) + '" autocomplete="off"></div>';
        }).join('') + '</div>';
      }
      if (st.textarea) {
        var ta = st.textarea;
        html += '<div class="field"><label for="f-' + ta.f + '">' + esc(ta.label) + '</label>' +
          '<textarea id="f-' + ta.f + '" data-f="' + ta.f + '" rows="' + ta.rows + '" placeholder="' + esc(ta.ph) + '">' + esc(state[ta.f]) + '</textarea></div>';
      }
      if (st.hint) html += '<p class="hint">' + esc(st.hint) + '</p>';
      html += '<p class="need" id="need" aria-live="polite"></p>' +
        '<div class="nav"><button type="button" class="link" data-act="back">Назад</button>' +
        '<button type="button" class="btn" id="next" data-act="next">' + (st.id === 'words' ? 'Показать итог' : 'Дальше') + '</button></div>' +
        '</section>';
    }
    app.innerHTML = html;
    updateNext();
  }

  function updateNext() {
    var st = STEPS[cur];
    var btn = document.getElementById('next');
    var need = document.getElementById('need');
    if (!btn) return;
    var msg = st.need ? st.need() : '';
    btn.disabled = !!msg;
    if (need) need.textContent = msg;
  }

  var busy = false;
  function go(n) {
    if (busy) return;
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var el = app.querySelector('.step');
    if (!el || reduce) {
      cur = n;
      render();
      try { window.scrollTo(0, 0); } catch (e) {}
      return;
    }
    busy = true;
    el.classList.add('leave');
    setTimeout(function () {
      busy = false;
      cur = n;
      render();
      try { window.scrollTo(0, 0); } catch (e) {}
    }, 260);
  }

  function toggle(btn) {
    var key = btn.getAttribute('data-k');
    var v = btn.getAttribute('data-v');
    var g = G[key];
    var arr = state[key];
    var i = arr.indexOf(v);
    if (i >= 0) arr.splice(i, 1);
    else { arr.push(v); if (arr.length > g.max) arr.shift(); }
    var nodes = app.querySelectorAll('[data-k="' + key + '"]');
    for (var n = 0; n < nodes.length; n++) {
      nodes[n].setAttribute('aria-pressed', arr.indexOf(nodes[n].getAttribute('data-v')) >= 0 ? 'true' : 'false');
    }
    if (arr.indexOf(v) >= 0) {
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
    }
    save();
    updateNext();
  }

  function flash(msg) {
    var s = document.getElementById('status');
    if (s) s.textContent = msg;
  }
  function showFallback() {
    var box = document.getElementById('fallback');
    var ta = document.getElementById('fbtext');
    if (!box || !ta) return;
    ta.value = messageText();
    box.hidden = false;
    ta.focus();
    ta.select();
    flash('Выдели текст ниже, скопируй и отправь мне.');
  }
  function seal() {
    var pc = app.querySelector('.postcard');
    if (pc && pc.classList.contains('fold')) return;
    if (CONFIG.endpoint && sendState !== 'ok' && sendState !== 'sending') send();
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (pc && !reduce) {
      pc.classList.add('fold');
      setTimeout(function () {
        sealed = true;
        render();
        try { window.scrollTo(0, 0); } catch (e) {}
      }, 650);
    } else {
      sealed = true;
      render();
    }
  }
  function copyChoice() {
    try {
      navigator.clipboard.writeText(messageText()).then(function () {
        flash('Скопировано. Вставь в чат со мной.');
      }, showFallback);
    } catch (e) { showFallback(); }
  }

  app.addEventListener('click', function (e) {
    var opt = e.target.closest('[data-k]');
    if (opt) { toggle(opt); return; }
    var act = e.target.closest('[data-act]');
    if (!act) return;
    var a = act.getAttribute('data-act');
    if (a === 'next') { if (!act.disabled) go(cur + 1); }
    else if (a === 'back') go(cur - 1);
    else if (a === 'edit' || a === 'unseal') { sealed = false; go(1); }
    else if (a === 'seal') seal();
    else if (a === 'copy') copyChoice();
  });
  app.addEventListener('input', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-f');
    if (f) { state[f] = e.target.value; save(); updateNext(); }
  });

  var motes = document.createElement('div');
  motes.className = 'motes';
  motes.setAttribute('aria-hidden', 'true');
  var mh = '';
  for (var m = 0; m < 16; m++) {
    var dur = 16 + ((m * 5) % 9);
    mh += '<i style="left:' + ((m * 61 + 13) % 100) + '%;--s:' + (2 + ((m * 7) % 3)) + 'px;--d:' + dur + 's;--dl:-' + ((m * 2.3) % dur).toFixed(1) + 's;--x:' + ((m % 2 ? 1 : -1) * (10 + ((m * 13) % 40))) + 'px"></i>';
  }
  motes.innerHTML = mh;
  document.body.insertBefore(motes, app);

  render();
})();
</script>

</body>
</html>
